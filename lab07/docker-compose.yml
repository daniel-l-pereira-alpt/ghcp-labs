services:
  # Reminder engine worker: validates startup prerequisites, waits for Postgres,
  # and then runs the scheduler demo on a fixed interval.
  reminder-engine:
    build:
      context: ..
      dockerfile: lab07/Dockerfile
    container_name: lab07-reminder-engine
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: reminders
      DB_USER: reminder_app
      DB_PASSWORD: reminder_secret
      SCHEDULER_INTERVAL_SECONDS: "300"
    volumes:
      # Persist generated evidence artifacts outside the container lifecycle.
      - ./data/evidence:/app/evidence
    networks:
      - reminder-net
    command:
      - /bin/sh
      - -ec
      - |
          python - <<'PY'
          import os
          import socket
          import sys
          import time

          required = ("DB_HOST", "DB_PORT", "DB_NAME", "DB_USER", "DB_PASSWORD")
          missing = [name for name in required if not os.getenv(name)]
          if missing:
              print(
                  f"Missing required environment variables: {', '.join(missing)}",
                  file=sys.stderr,
              )
              sys.exit(1)

          host = os.environ["DB_HOST"]
          port = int(os.environ["DB_PORT"])
          for attempt in range(1, 31):
              try:
                  with socket.create_connection((host, port), timeout=3):
                      print(f"Database reachable at {host}:{port}", flush=True)
                      break
              except OSError as exc:
                  print(
                      f"Waiting for database ({attempt}/30): {exc}",
                      file=sys.stderr,
                      flush=True,
                  )
                  time.sleep(2)
          else:
              print("Database did not become reachable in time", file=sys.stderr)
              sys.exit(1)
          PY

          while true; do
            python run_sprint_demo.py
            sleep "$${SCHEDULER_INTERVAL_SECONDS}"
          done
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, socket;
          required = ('DB_HOST', 'DB_PORT', 'DB_NAME', 'DB_USER', 'DB_PASSWORD');
          missing = [name for name in required if not os.getenv(name)];
          assert not missing, 'Missing env vars: ' + ', '.join(missing);
          conn = socket.create_connection((os.environ['DB_HOST'], int(os.environ['DB_PORT'])), 5);
          conn.close()
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # PostgreSQL backing service with persistent storage and an explicit readiness probe.
  postgres:
    image: postgres:16-alpine
    container_name: lab07-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reminders
      POSTGRES_USER: reminder_app
      POSTGRES_PASSWORD: reminder_secret
    volumes:
      # Persist the database cluster on a named volume.
      - postgres-data:/var/lib/postgresql/data
    networks:
      - reminder-net
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# Custom bridge network for service-to-service communication.
networks:
  reminder-net:
    driver: bridge

# Persistent volumes for database state.
volumes:
  postgres-data: