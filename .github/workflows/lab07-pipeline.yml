name: Lab07 Supply-Chain CI/CD

on:
  push:
    branches: [lab07/pr-workflow]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lab07 dependencies
        run: pip install -r lab07/requirements.txt

      - name: Generate SBOM (CycloneDX)
        run: |
          pip install cyclonedx-bom
          python -m cyclonedx_py requirements \
            -i lab07/requirements.txt > lab07/sbom.xml

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: lab07/sbom.xml

  scan:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: lab07/

      - name: Run CVE scan
        run: |
          pip install pip-audit
          pip-audit -r lab07/requirements.txt --format=json -o lab07/cve-report.json

      - name: Upload CVE report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: cve-report
          path: lab07/cve-report.json

      - name: Surface CVE failures
        if: ${{ failure() }}
        run: |
          echo "::error::CVE scan failed. Download the cve-report artifact for details."
          exit 1

  validate-iac:
    runs-on: ubuntu-latest
    needs: scan

    steps:
      - uses: actions/checkout@v4

      - name: Install Azure CLI when Bicep file exists
        if: ${{ hashFiles('lab07/main.bicep') != '' }}
        run: curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Validate Bicep
        if: ${{ hashFiles('lab07/main.bicep') != '' }}
        run: az bicep install && az bicep build --file lab07/main.bicep

      - name: Set up Terraform when Terraform file exists
        if: ${{ hashFiles('lab07/main.tf') != '' }}
        uses: hashicorp/setup-terraform@v3

      - name: Validate Terraform
        if: ${{ hashFiles('lab07/main.tf') != '' }}
        run: |
          cd lab07
          terraform init -backend=false
          terraform validate

      - name: Surface IaC errors
        if: ${{ failure() }}
        run: echo "::error::IaC validation failed"

  manual-approval:
    runs-on: ubuntu-latest
    needs: validate-iac
    environment: production

    steps:
      - name: Await production approval
        run: echo "All gates passed. Pending approval."

  deploy:
    runs-on: ubuntu-latest
    needs: manual-approval

    steps:
      - name: Dry-run deploy
        run: |
          echo "Would run: az deployment group create --what-if ..."
          echo "Would run: terraform plan"
